<app-header></app-header>

<div class="container">
  <h2>Subjects Form</h2>

  <form (ngSubmit)="saveSubject()" #subjectForm="ngForm" class="form">
    <label>Name</label>
    <input [(ngModel)]="subject.name" name="name" required placeholder="Enter subject name">

    <label>Description</label>
    <input [(ngModel)]="subject.description" name="description" required placeholder="Enter subject description">

    <div class="button-group">
      <button type="submit" class="btn-add">{{ editMode ? 'Update' : 'Add' }}</button>
      <button type="button" (click)="resetForm()" class="btn-clear">Clear</button>
    </div>
  </form>

  <h2>Subjects List</h2>

  <table>
    <thead>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let subj of subjects">
      <td>{{ subj.name }}</td>
      <td>{{ subj.description }}</td>
      <td>
        <button (click)="editSubject(subj)" class="btn-edit">Edit</button>
        <button (click)="deleteSubject(subj.id!)" class="btn-delete">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
