<app-header></app-header>
<div class="container">
  <h2>Product Form</h2>
  <form (ngSubmit)="saveProduct()" class="form">
    <label>Name</label>
    <input [(ngModel)]="product.name" name="name" required>
    <label>Price</label>
    <input [(ngModel)]="product.price" name="price" type="number" required>
    <div class="button-group">
      <button type="submit" class="btn-add">{{ editMode ? 'Update' : 'Add' }}</button>
      <button type="button" (click)="resetForm()" class="btn-clear">Clear</button>
    </div>
  </form>

  <table>
    <thead><tr><th>Name</th><th>Price</th><th>Actions</th></tr></thead>
    <tbody>
    <tr *ngFor="let p of products">
      <td>{{ p.name }}</td>
      <td>{{ p.price }}</td>
      <td>
        <button (click)="editProduct(p)" class="btn-edit">Edit</button>
        <button (click)="deleteProduct(p.id!)" class="btn-delete">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
