<app-header></app-header>
<div class="container">
  <h2>Purchase Order Form</h2>
  <form (ngSubmit)="savePurchaseOrder()" class="form">
    <label>Supplier</label>
    <select [(ngModel)]="po.supplierId" name="supplierId" required>
      <option *ngFor="let s of suppliers" [value]="s.id">{{ s.name }}</option>
    </select>

    <label>Product</label>
    <select [(ngModel)]="po.productId" name="productId" required>
      <option *ngFor="let p of products" [value]="p.id">{{ p.name }}</option>
    </select>

    <label>Quantity</label>
    <input [(ngModel)]="po.quantity" name="quantity" type="number" required>

    <div class="button-group">
      <button type="submit" class="btn-add">{{ editMode ? 'Update' : 'Add' }}</button>
      <button type="button" (click)="resetForm()" class="btn-clear">Clear</button>
    </div>
  </form>

  <table>
    <thead><tr><th>Supplier</th><th>Product</th><th>Quantity</th><th>Actions</th></tr></thead>
    <tbody>
    <tr *ngFor="let po of purchaseOrders">
      <td>{{ getSupplierName(po.supplierId) }}</td>
      <td>{{ getProductName(po.productId) }}</td>
      <td>{{ po.quantity }}</td>
      <td>
        <button (click)="editPurchaseOrder(po)" class="btn-edit">Edit</button>
        <button (click)="deletePurchaseOrder(po.id!)" class="btn-delete">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
