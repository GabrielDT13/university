<app-header></app-header>
<div class="container">
  <h2>Employee Form</h2>
  <form (ngSubmit)="saveEmployee()" #form="ngForm" class="form">
    <label>Name</label>
    <input [(ngModel)]="employee.name" name="name" required>
    <label>Department</label>
    <input [(ngModel)]="employee.department" name="department" required>
    <div class="button-group">
      <button type="submit" class="btn-add">{{ editMode ? 'Update' : 'Add' }}</button>
      <button type="button" (click)="resetForm()" class="btn-clear">Clear</button>
    </div>
  </form>

  <table>
    <thead><tr><th>Name</th><th>Department</th><th>Actions</th></tr></thead>
    <tbody>
    <tr *ngFor="let e of employees">
      <td>{{ e.name }}</td>
      <td>{{ e.department }}</td>
      <td>
        <button (click)="editEmployee(e)" class="btn-edit">Edit</button>
        <button (click)="deleteEmployee(e.id!)" class="btn-delete">Delete</button>
      </td>
    </tr>
    </tbody>
  </table>
</div>
